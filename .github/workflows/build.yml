name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Gradle stamps these into versionCode and versionName.
      BUILD_NUMBER: ${{ github.run_number }}
      BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        id: apk
        run: |
          built=app/build/outputs/apk/debug/app-debug.apk
          meta=app/build/outputs/apk/debug/output-metadata.json
          test -f "$built"

          # Take the version from what the build actually stamped into the APK, so the
          # name of the file can never claim a version the manifest does not carry.
          version=$(jq -r '.elements[0].versionName // empty' "$meta" 2>/dev/null || true)
          [ -n "$version" ] || version="1.0.${BUILD_NUMBER}+${BUILD_COMMIT:0:7}"
          short_sha="${BUILD_COMMIT:0:7}"
          # '+' is legal in a file name but confuses enough URL handling to avoid it.
          versioned="oCam-$(printf '%s' "$version" | tr '+' '-')-debug.apk"

          cp "$built" "$versioned"
          # A second copy under a name that never changes, so the download link
          # and the QR code pointing at it keep working across builds.
          cp "$built" oCam-debug.apk

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "versioned=$versioned" >> "$GITHUB_OUTPUT"
          echo "Built $versioned ($(du -h "$versioned" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: oCam-${{ steps.apk.outputs.version }}-debug
          path: ${{ steps.apk.outputs.versioned }}
          if-no-files-found: error

      # A release asset is a direct .apk a phone can install by tapping it; the
      # artifact above is a zip. Rolling tag - each build replaces the files.
      - name: Publish APK to the rolling debug release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          SHORT_SHA: ${{ steps.apk.outputs.short_sha }}
          VERSIONED: ${{ steps.apk.outputs.versioned }}
        run: |
          notes="oCam $VERSION, built $(date -u '+%Y-%m-%d %H:%M UTC') from $SHORT_SHA.

          That same version string is in the APK's manifest, in the name of the
          versioned file, and at the bottom of the app's settings sheet.

          oCam-debug.apk always points at the newest build; the versioned file
          next to it is this build specifically."

          gh release view debug-latest >/dev/null 2>&1 || \
            gh release create debug-latest \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Debug build" \
              --notes "$notes"

          gh release edit debug-latest --title "oCam $VERSION" --notes "$notes"

          gh release upload debug-latest "$VERSIONED" oCam-debug.apk --clobber

          # The rolling release holds exactly this build: the versioned file and
          # the fixed-name copy. Anything else is a leftover from an older build
          # and would quietly hand someone a stale APK.
          gh release view debug-latest --json assets -q '.assets[].name' \
            | while read -r asset; do
                case "$asset" in
                  "$VERSIONED" | oCam-debug.apk) ;;
                  *) echo "Removing stale asset $asset"
                     gh release delete-asset debug-latest "$asset" --yes || true ;;
                esac
              done
