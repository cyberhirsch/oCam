name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: minimal-camera-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A release asset is a direct .apk a phone can install by tapping it; the
      # artifact above is a zip. Rolling tag - each build replaces the file.
      - name: Publish APK to the rolling debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view debug-latest >/dev/null 2>&1 || \
            gh release create debug-latest \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Debug build" \
              --notes "Rolling debug APK, replaced by every CI build on this branch."
          gh release upload debug-latest \
            app/build/outputs/apk/debug/app-debug.apk --clobber
